# pre-commit 配置 — wechat-download-api（2026-10-13 引入，对齐 Claw/QTS/StockInsight 门禁体系）
# 安装：pre-commit install（本仓库已于 2026-10-13 装好）
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
